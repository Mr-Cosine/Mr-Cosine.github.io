<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SciHelper Demo</title>
 
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans&family=Noto+Sans+Math&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans', sans-serif;
            background: #f0f4f9;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

    </style>
    <link rel="stylesheet" href="asset/software/SciHelper/katex/katex.min.css">
    <link rel="stylesheet" href="asset/software/SciHelper/style.css">
    <link rel="stylesheet" href="asset/software/SciHelper/style_phys.css">
    <link rel="stylesheet" href="asset/software/SciHelper/style_chem.css">
    <link rel="stylesheet" href="asset/software/SciHelper/style_gen.css">
</head>
<body>
 
<div id="demo-area"></div>

<script src="asset/software/SciHelper/katex/katex.min.js"></script>
<script src="asset/software/SciHelper/resources.js"></script>
<script src="asset/software/SciHelper/Chemistry_lib.js"></script>
<script src="asset/software/SciHelper/General_lib.js"></script>
<script src="asset/software/SciHelper/Physics_lib.js"></script>
<script src="asset/software/SciHelper/SciHelper_lib.js"></script>
<script src="asset/software/SciHelper/SciHelper.js"></script>
 
<script>
    const demoArea = document.getElementById('demo-area');
    let isInitialized = false;

    badRatio = () => {return window.innerWidth < 768 && window.innerHeight > window.innerWidth;}

    function checkScreen() {
        if (badRatio()) {
            demoArea.innerHTML = '';
            demoArea.innerHTML = `
                <div style="padding: 20px; text-align: center; display: flex; flex-direction: column; justify-content: center; height: 100%;">
                    <p style="font-size: 1.2rem; font-weight: bold;">This device's aspect ratio is not supported.</p>
                    <p>Please rotate to landscape or use a larger screen, then refresh the page.</p>
                </div>`;
                
            const panels = document.querySelectorAll('[id^="sci"]');
            panels.forEach(p => {p.remove()});
            isInitialized = false;
        }
        else {if (!isInitialized) initPlugin();}
    }

    function initPlugin() {
        if (badRatio()) {isInitialized = false; return;}
        if (isInitialized) return;

        const restoreBtn = document.getElementById('sci-restore-btn');
        if (!restoreBtn) return;

        isInitialized = true;
        demoArea.innerHTML = ""; // Clear warning text
        demoArea.appendChild(restoreBtn);

        // Simulate clicks
        const mdEvt = new MouseEvent('mousedown', { bubbles: true });
        restoreBtn.dispatchEvent(mdEvt);

        setTimeout(() => {
            const muEvt = new MouseEvent('mouseup', { bubbles: true });
            restoreBtn.dispatchEvent(muEvt);

            setTimeout(() => {
                const panelIds = [
                    'sci-mainpanel', 'sci-chempanel', 'sci-genpanel',
                    'sci-chempanel-elesearch', 'sci-chempanel-molcalc',
                    'sci-chempanel-limcalc', 'sci-chempanel-elecchem',
                    'sci-genpanel-poly', 'sci-infopanel',
                    'sci-infopanel-contentpage'
                ];
                
                panelIds.forEach(id => {
                    const el = document.getElementById(id);
                    if (el && el.parentNode !== demoArea) {
                        demoArea.appendChild(el);
                    }
                });

                const main = document.getElementById('sci-mainpanel');
                if (main) {
                    main.style.left = '30px';
                    main.style.top  = '20px';
                }
            }, 50);
        }, 40);
    }

    window.addEventListener('load', checkScreen);

    window.addEventListener('resize', checkScreen);

    // MutationObserver remains the same
    const observer = new MutationObserver(mutations => {
        if (!badRatio()) {
            mutations.forEach(m => {
                m.addedNodes.forEach(node => {
                    if (node.nodeType === 1 && node.parentNode === document.body) {
                        if (node.id && node.id.startsWith('sci-')) {
                            demoArea.appendChild(node);
                        }
                    }
                });
            });
        }
    });
    observer.observe(document.body, { childList: true });
</script>
 
</body>
</html>
