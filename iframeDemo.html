<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SciHelper Demo</title>
 
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans&family=Noto+Sans+Math&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans', sans-serif;
            background: #f0f4f9;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

    </style>
    <link rel="stylesheet" href="asset/software/SciHelper/style.css">
</head>
<body>
 
<div id="demo-area"></div>

<script src="asset/software/SciHelper/resources.js"></script>
<script src="asset/software/SciHelper/Chemistry_lib.js"></script>
<script src="asset/software/SciHelper/General_lib.js"></script>
<script src="asset/software/SciHelper/SciHelper_lib.js"></script>
<script src="asset/software/SciHelper/SciHelper.js"></script>
 
<script>
    function badRatio() {
        return window.innerWidth < 768 && window.innerHeight/window.innerWidth > 1;
    }
 
    const demoArea = document.getElementById('demo-area');
    let isInitialized = false;
 
    window.addEventListener('load', function () {
        if (isInitialized) return;
        const restoreBtn = document.getElementById('sci-restore-btn');
        if (restoreBtn) {
            // Move restore button into demo area
            demoArea.appendChild(restoreBtn);

            isInitialized = true;
    
            // Simulate a short click to trigger initSciHelper
            const mdEvt = new MouseEvent('mousedown', { bubbles: true });
            restoreBtn.dispatchEvent(mdEvt);
    
            setTimeout(() => {
                const muEvt = new MouseEvent('mouseup', { bubbles: true });
                restoreBtn.dispatchEvent(muEvt);
    
                // Move the panel and any sub-panels into demo-area
                setTimeout(() => {
                    ['sci-mainpanel', 'sci-chempanel', 'sci-genpanel',
                    'sci-chempanel-elesearch', 'sci-chempanel-molcalc',
                    'sci-chempanel-limcalc', 'sci-chempanel-elecchem',
                    'sci-genpanel-poly', 'sci-infopanel',
                    'sci-infopanel-contentpage'
                    ].forEach(id => {
                        const el = document.getElementById(id);
                        if (el && el.parentNode !== demoArea) {
                            demoArea.appendChild(el);
                        }
                    });
    
                    // Position panel nicely
                    const panel = document.getElementById('sci-mainpanel');
                    if (panel) {
                        panel.style.left = '30px';
                        panel.style.top  = '20px';
                    }
                }, 50);
            }, 40);
        }
    });

    function handleDisplay() {
        if (badRatio()) {
            demoArea.innerHTML = "<div><p>This device's aspect ratio is not supported.</p><p style='font-size: 0.8em; font-weight: normal; margin-top: 10px;'>Please rotate to landscape or use a larger screen, then refresh.</p></div>";
            const panels = demoArea.querySelectorAll('[id^="sci-"]');
            panels.forEach(p => p.style.display = 'none');
        } 
        
        else {
            // Screen is big enough
            const panels = demoArea.querySelectorAll('[id^="sci-"]');
            panels.forEach(p => p.style.display = ''); 
            
            if (!isInitialized) {
                initDemo();
            }
        }
    }

    window.addEventListener('load', handleDisplay);
    window.addEventListener('resize', handleDisplay);
 
    // Observe DOM for any new plugin panels appended to body and reroute them
    const observer = new MutationObserver(mutations => {
        if (!badRatio()){
            mutations.forEach(m => {
                m.addedNodes.forEach(node => {
                    if (node.nodeType === 1 && node.parentNode === document.body) {
                        const id = node.id || '';
                        if (id.startsWith('sci-')) {
                            demoArea.appendChild(node);
                        }
                    }
                });
            });
        }
    });
    observer.observe(document.body, { childList: true });
</script>
 
</body>
</html>
